# https://taskfile.dev

version: '3'

vars:
  URL_SKIP_RE: '!/(instagram|linkedin|twitter|marketplace.visualstudio|reddit).com|bsky.app/'
  V_AWESOME_LINT: v2.3.0

tasks:
  default:
    deps: [lint]

  lint:
    desc: Run all linters.
    deps:
      - lint:editorconfig
      - lint:links
      - lint:awesome-lint

  lint:awesome-lint:
    desc: Run the linter for awesome lists.
    cmd: npx awesome-lint@{{.V_AWESOME_LINT}} {{.CLI_ARGS | default "README.md README_ZH.md"}}

  lint:editorconfig:
    desc: Check that files conform to editorconfig rules.
    cmd: go tool editorconfig-checker {{.CLI_ARGS | default "."}}

  lint:links:
    desc: Check for broken links. Update any permanent-redirects.
    cmd: >
        go tool xurls {{.CLI_ARGS | default "*.md"}}
        | sort -u
        | gawk '{{.URL_SKIP_RE}}'
        | go tool xurls -fix

  lint:pr:editorconfig:
    desc: Run editorconfig-checker on files changed in a PR diff.
    cmd: |
      FILES=$(git diff --name-only "{{.CLI_ARGS}}"...HEAD | tr '\n' ' ')
      if [ -n "$FILES" ]; then
        go tool editorconfig-checker $FILES
      else
        echo "No files changed, skipping editorconfig check"
      fi

  lint:pr:awesome-lint:
    desc: Run awesome-lint on README files changed in a PR diff.
    cmd: |
      FILES=$(git diff --name-only "{{.CLI_ARGS}}"...HEAD -- README.md README_ZH.md | tr '\n' ' ')
      if [ -n "$FILES" ]; then
        npx awesome-lint@{{V_AWESOME-LINT}} $FILES
      else
        echo "No README files changed, skipping awesome-lint"
      fi

  lint:pr:links:
    desc: Check links added in a PR diff.
    cmd: |
      SHA={{.CLI_ARGS}}
      URLS=$(git diff "$SHA"...HEAD -- '*.md' \
        | grep '^+' | grep -oP 'https?://[^\s)>"'"'"']+' || true)
      if [ -n "$URLS" ]; then
        echo "$URLS" | sort -u \
          | gawk '{{.URL_SKIP_RE}}' \
          | go tool xurls -fix
      else
        echo "No new URLs in PR diff, skipping link check"
      fi

  update:
    desc: Update go tools and verify that they build cleanly.
    cmds:
      - go get -u tool
      - go mod tidy
      - go build -o /dev/null tool
