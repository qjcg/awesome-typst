name: Run Linters

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "00 18 * * *"

jobs:
  lint:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        linter: [editorconfig, awesome-lint, links]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: go tool task lint:pr:${{ matrix.linter }} -- $SHA
        env:
          SHA: ${{ github.event.pull_request.base.sha }}

  full-scan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: go tool task lint
